spring.application.name=archivo-backend

# --- Base de datos ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:archivo_sanjose}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:1234}

# --- JPA / Hibernate ---
# Flyway controla el esquema; Hibernate solo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- JWT ---
# Mínimo 32 bytes. En producción se define con JWT_SECRET.
app.jwt.secret=${JWT_SECRET:cambiar-este-secreto-en-produccion-minimo-32-bytes-de-largo}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

logging.level.com.municipalidadsanjose.archivo.security=DEBUG

# --- Almacenamiento de documentos digitalizados (filesystem local) ---
app.storage.base-dir=${STORAGE_BASE_DIR:./storage/documentos}
app.storage.max-file-size-bytes=${STORAGE_MAX_FILE_SIZE_BYTES:20971520}
app.storage.tipos-mime-permitidos=${STORAGE_TIPOS_MIME_PERMITIDOS:application/pdf,image/jpeg,image/png,image/tiff}

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=200MB

# --- OCR automático ---
app.ocr.enabled=${OCR_ENABLED:true}
app.ocr.url=${OCR_URL:http://localhost:8091}
app.ocr.timeout-seconds=${OCR_TIMEOUT_SECONDS:300}
app.ocr.max-artifact-bytes=${OCR_ARTIFACT_MAX_BYTES:134217728}
app.ocr.review-threshold=${OCR_REVIEW_THRESHOLD:0.75}

app.ocr.poll-millis=${OCR_POLL_MILLIS:2000}
app.ocr.lease-seconds=${OCR_LEASE_SECONDS:120}
