spring.application.name=archivo-backend

# --- Base de datos ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:archivo_sanjose}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:1234}

# --- JPA / Hibernate ---
# El esquema lo controla Flyway (db/migration). Hibernate solo valida que las
# entidades coincidan; nunca genera ni modifica tablas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- JWT ---
# Secreto para firmar los tokens (HMAC-SHA256, requiere >= 256 bits / 32 bytes).
# En producción SIEMPRE se debe sobreescribir vía la variable de entorno JWT_SECRET.
app.jwt.secret=${JWT_SECRET:cambiar-este-secreto-en-produccion-minimo-32-bytes-de-largo}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# Para ver en consola por qué se rechaza un JWT (mal formado, vencido, etc.)
logging.level.com.municipalidadsanjose.archivo.security=DEBUG

# --- Almacenamiento de documentos digitalizados (filesystem local) ---
# Organizado en subcarpetas por expediente_id. Rutas guardadas en la BD son
# siempre relativas a este directorio, nunca absolutas.
app.storage.base-dir=${STORAGE_BASE_DIR:./storage/documentos}
app.storage.max-file-size-bytes=${STORAGE_MAX_FILE_SIZE_BYTES:20971520}
app.storage.tipos-mime-permitidos=${STORAGE_TIPOS_MIME_PERMITIDOS:application/pdf,image/jpeg,image/png,image/tiff}

# Tope a nivel framework, por encima del límite de negocio de arriba: es la
# última red de seguridad antes de que Spring rechace el request completo.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=200MB
