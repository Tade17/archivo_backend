# Perfil para cuando la base corre en el Postgres de docker-compose.yml
# (mapeado a 5433 en el host para no chocar con un Postgres nativo en 5432).
# Activar con: SPRING_PROFILES_ACTIVE=docker (o --spring.profiles.active=docker)
spring.datasource.url=jdbc:postgresql://localhost:5433/archivo_sanjose
