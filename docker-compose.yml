services:
  postgres:
    image: postgres:17
    container_name: archivo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: archivo_sanjose
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
    ports:
      # Host 5433 -> contenedor 5432: así no choca con un Postgres nativo que
      # ya esté usando el 5432 para otros proyectos. La app debe apuntar a
      # DB_PORT=5433 cuando use este Postgres (ver README).
      - "5433:5432"
    volumes:
      - archivo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d archivo_sanjose"]
      interval: 5s
      timeout: 5s
      retries: 10

  ocr:
    build:
      context: ./ocr_service
    container_name: archivo-ocr
    restart: unless-stopped
    environment:
      OCR_MAX_BYTES: "26214400"
      OCR_MAX_PAGES: "100"
      OCR_PDF_DPI: "220"
    ports:
      - "127.0.0.1:8091:8091"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8091/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

# Los datos persisten en un volumen con nombre (no en el filesystem del
# contenedor): "docker compose down" no borra la base; "docker compose down -v"
# sí, si en algún momento se quiere arrancar de cero.
volumes:
  archivo_postgres_data:
